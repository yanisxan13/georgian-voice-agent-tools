name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sS --fail --max-time 90 --retry 3 --retry-delay 20 --retry-all-errors https://georgian-voice-agent-tools.onrender.com/health
